<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请详情 · Oversight</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Oversight · 申请详情</strong><a class="button" href="/">返回清单</a></header><main class="detail-main"><div class="card"><h1 th:text="${app.name}"></h1><p>申请ID：<code th:text="${app.id}"></code></p><p>类型：<b th:text="${app.kind}"></b>　状态：<b th:text="${app.status}"></b>　结果：<b th:text="${app.result}"></b></p><p>脚本UUID：<code th:text="${app.script_uuid}"></code></p><p>脚本 SHA-256：<code th:text="${app.sha256}"></code></p><p>目标主机与用户：<code th:text="${app.targets}"></code></p><p>审批人：<span th:text="${app.approver}"></span>　意见：<span th:text="${app.reason}"></span></p><p>逐主机结果：<code th:text="${app.results}"></code></p></div><div class="card"><h2>待审批脚本（只读）</h2><pre class="log" th:text="${app.content}"></pre><p class="muted">批准即授权执行此内容，脚本配置中含本次任务的回传凭据，请勿外传。</p></div><div class="card" th:if="${app.status == 'PENDING'}"><form method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="reason">审批意见</label><textarea id="reason" name="reason" rows="3" maxlength="500" style="width:100%"></textarea><div class="actions"><button class="secondary" th:formaction="@{/approvals/{id}/reject(id=${app.id})}">驳回申请</button><button th:formaction="@{/approvals/{id}/approve(id=${app.id})}">批准并执行</button></div></form></div></main></body></html>
