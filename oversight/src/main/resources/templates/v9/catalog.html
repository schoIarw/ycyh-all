<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V9脚本与资源登记</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Oversight · 脚本与资源登记</strong><a class="button" href="/">任务清单</a></header><main class="detail-main"><div class="card"><h1>脚本版本目录</h1><p>系统预登记 ycyh_es_install，部署配置通过第一个脚本参数传入。接口文档未定义登记接口，模拟平台由管理员在此导入，标准调用仅使用V9协议。</p><table><thead><tr><th>脚本名称</th><th>版本ID</th><th>脚本UUID</th><th>风险</th></tr></thead><tbody><tr th:each="s:${scripts}"><td th:text="${s.get('scriptNameZh').asText()}"></td><td th:text="${s.get('scriptInfoVersionId').asText()}"></td><td th:text="${s.get('srcScriptUuid').asText()}"></td><td th:text="${s.get('level').asText()}"></td></tr></tbody></table></div><div class="card"><h2>导入模拟目录</h2><p>使用 docs/V9_PROTOCOL.md 中的JSON格式。可登记脚本、版本、参数、附件、分类、资源组与常用任务；目标IP及用户仍必须在SSH白名单中。</p><form th:action="@{/catalog/import}" method="post" enctype="multipart/form-data"><input type="file" name="file" accept="application/json,.json" required><button>审核并登记目录</button></form></div><div class="card"><h2>已登记资源与常用任务</h2><pre class="log" th:text="${catalog}"></pre></div></main></body></html>
