<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="10"><title>Oversight V9 任务申请</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Oversight · V9脚本管控</strong><div><span th:text="${#httpServletRequest.remoteUser}"></span>　<form th:action="@{/logout}" method="post"><button>退出</button></form></div></header><main class="detail-main"><div class="toolbar"><div><h1>任务申请与执行</h1><p class="muted">V9协议 · secretToken · 脚本版本 / 任务 / 审批 / 实例</p></div><a class="button" href="/catalog">脚本与资源登记</a></div><p class="notice">白名单脚本申请后直接执行；风险脚本审批通过后进入待执行状态。集群管理系统会通过V9启动接口启动已批准的部署任务。</p><div class="card"><table><thead><tr><th>任务 / ID</th><th>申请用户</th><th>风险等级</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody><tr th:each="t:${applications}"><td><b th:text="${t.name}"></b><small th:text="${t.id}"></small></td><td th:text="${t.owner}"></td><td th:text="${t.level}"></td><td th:text="${t.status}"></td><td th:text="${t.created}"></td><td><a th:href="@{/approvals/{id}(id=${t.id})}">审批 / 执行 / 日志</a></td></tr></tbody></table><p th:if="${#lists.isEmpty(applications)}">暂无任务申请</p></div></main></body></html>
