<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V9任务详情</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Oversight · 任务详情</strong><a class="button" href="/">返回清单</a></header><main class="detail-main"><div class="card"><h1 th:text="${task.name}"></h1><p>任务ID：<code th:text="${task.id}"></code>　审批ID：<code th:text="${task.auditId}"></code></p><p>状态：<b th:text="${task.status}"></b>　意见：<span th:text="${task.comment}"></span></p><form th:if="${task.status=='AWAITING_APPROVAL'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>审批意见（驳回必填）</label><textarea name="reason" maxlength="2000" style="width:100%" rows="3"></textarea><div class="actions"><button th:formaction="@{/approvals/{id}/reject(id=${task.id})}" class="secondary">驳回</button><button th:formaction="@{/approvals/{id}/approve(id=${task.id})}">批准，等待启动</button></div></form><form th:if="${task.auditState==1 and !task.active and !task.launched and task.status=='READY'}" th:action="@{/approvals/{id}/start(id=${task.id})}" method="post"><button>启动已批准任务</button></form><form th:if="${task.active}" th:action="@{/approvals/{id}/stop(id=${task.id})}" method="post"><button>终止本任务实例</button></form></div><div class="card"><h2>固定申请内容与脚本快照</h2><p class="muted">ID以原始十进制展示；审批内容包含脚本版本、参数、附件和主机，登记变更不会影响已提交快照。</p><pre class="log" th:text="${task.snapshot}"></pre></div><div class="card" th:each="r:${runtimes}"><h2 th:text="${r.get('ip').asText()}"></h2><p>运行实例：<code th:text="${r.get('id').asText()}"></code>　状态：<b th:text="${r.get('state').asText()}"></b></p><pre class="log" th:text="${r.get('log').asText()}"></pre></div><a class="button" th:href="@{/approvals/{id}(id=${task.id})}">刷新状态与日志</a></main></body></html>
