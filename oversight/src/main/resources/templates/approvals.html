<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="10"><title>Oversight · 调用审批</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>Oversight <span class="pill">集群管控审批</span></strong><div><span th:text="${#httpServletRequest.remoteUser}"></span>　<form th:action="@{/logout}" method="post"><button>退出</button></form></div></header><main class="detail-main"><div class="toolbar"><div><h1>调用申请</h1><p class="muted">脚本登记与执行均需审批；页面每10秒刷新</p></div><a class="button" href="/">刷新清单</a></div><div class="notice">DEPLOYMENT 将脚本登记和多主机执行合并为一份申请。批准后按原始脚本与主机清单执行；驳回不会执行。</div><div class="card"><table><thead><tr><th>申请 / 脚本</th><th>类型</th><th>状态</th><th>提交时间</th><th>审批人</th><th>操作</th></tr></thead><tbody><tr th:each="a:${applications}"><td><span th:text="${a.name}"></span><small th:text="${a.id}"></small></td><td th:text="${a.kind}"></td><td><span class="badge" th:classappend="${a.status}" th:text="${a.status}"></span></td><td th:text="${a.created_at}"></td><td th:text="${a.approver}"></td><td><a th:href="@{/approvals/{id}(id=${a.id})}">查看 / 审批</a></td></tr></tbody></table><p class="muted" th:if="${#lists.isEmpty(applications)}">暂无调用申请</p></div></main></body></html>
