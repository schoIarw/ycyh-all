<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oversight 集群管控审批 · 登录</title><link rel="stylesheet" href="/style.css"></head><body><div class="login"><h1>Oversight 集群管控审批</h1><p class="muted">请使用系统配置的管理账户登录</p><p class="error" th:if="${param.error}">用户名或密码错误</p><p th:if="${param.logout}">已安全退出</p><form th:action="@{/login}" method="post"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>登录</button></form></div></body></html>
