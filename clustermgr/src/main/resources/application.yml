server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/clustermgr}
    username: ${DB_USER:ycyh}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
clustermgr:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD}
  oversight-url: ${OVERSIGHT_URL:http://127.0.0.1:8081}
  oversight-key: ${OVERSIGHT_API_KEY}
  warehouse-url: ${WAREHOUSE_URL:http://127.0.0.1:8082}
  callback-base-url: ${CALLBACK_BASE_URL:http://127.0.0.1:8080}
  hosts: ${CLUSTER_HOSTS:127.0.0.1@es}
  allow-insecure-es: ${ALLOW_INSECURE_ES:false}
