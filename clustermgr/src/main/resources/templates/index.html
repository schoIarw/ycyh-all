<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>YCYH · ES集群部署</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><strong>YCYH <span class="pill">集群管理系统</span></strong><div><span th:text="${#httpServletRequest.remoteUser}"></span>　<form th:action="@{/logout}" method="post"><button>退出登录</button></form></div></header><aside><b>ES 管理</b><a href="/">◉　ES 集群部署</a></aside><main><div class="toolbar"><div><h1>ES 集群部署</h1><p class="muted">软件仓库 · 主机选择 · 管控审批 · 安装回传</p></div><button id="add-cluster">＋ 添加集群</button></div><div class="notice">每个集群合并提交一份管控申请，审批通过后执行。当前安装模板用于隔离验证环境，ES 安全认证关闭。UNKNOWN 状态需先核查远端，避免重复部署。</div><p id="page-error" class="error"></p><div class="card"><table><thead><tr><th>集群名称</th><th>软件包</th><th>主机数</th><th>部署状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="clusters"></tbody></table><p id="empty" class="muted" hidden>暂无集群，点击右上角添加</p></div><section id="details" class="card" hidden><div class="toolbar"><h2 id="detail-title"></h2><button class="secondary" id="close-details">收起</button></div><div id="task-details"></div><h3>安装详情与错误回传</h3><pre class="log" id="events">暂无回传</pre></section><footer>YCYH ALL 0.1.0 · 所有执行均经 Oversight 审批</footer></main><dialog id="deploy-dialog"><form id="deploy-form"><h1>添加 ES 集群</h1><p class="muted">提交后可从列表进入 Oversight 审批</p><label for="cluster-name">集群名称</label><input id="cluster-name" name="name" type="text" pattern="[a-z][a-z0-9-]{0,47}" maxlength="48" placeholder="例如 es-demo01" required><label for="package">仓库安装包（tar.gz）</label><select id="package" required></select><p id="package-info" class="muted"></p><label>选择主机（1—8台，使用预配置的非root用户）</label><div class="host-list" id="hosts"></div><p id="form-error" class="error"></p><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button type="submit" id="submit">提交部署申请</button></div></form></dialog></body></html>
