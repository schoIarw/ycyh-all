services:
  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_USER: ycyh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-ycyh.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycyh -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.0
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ycyh
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_DATABASE: oversight
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-ycyh.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
  mysqldata:
